name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_IMAGE: wodby/drupal-php@sha256:a97a10f209006fdd5ead19b4ccb47ae6a53044ba48942c1597b505eb84d5c55a
  PHP_BASE_COMMIT: 004cb827501d1ddaf98daacb185a53e0816f78a7
  PHP_SECURITY_COMMIT: 712e60f9edfd03f0960fc4fc3c2c375f42b90aa2
  PATCH_SHA256: de1b914a84b25196b82ede7d8c0031d43be72f232b259b984e7ef72507b10631

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact official patch
        run: sh scripts/verify-provenance.sh

  image:
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Pull pinned base image
        run: docker pull "$BASE_IMAGE"
      - name: Record base-image boundary
        run: |
          mkdir -p .artifacts
          docker image inspect "$BASE_IMAGE" > .artifacts/base-image-inspect.json
          docker run --rm --entrypoint sh "$BASE_IMAGE" -c '
            php -v
            cat /etc/os-release
            command -v php
            ldd "$(command -v php)"
            php -i | grep "^Configure Command"
          ' > .artifacts/base-runtime.txt
      - name: Build patched image
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build \
            --progress plain \
            --platform "${{ matrix.platform }}" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "PHP_BASE_COMMIT=$PHP_BASE_COMMIT" \
            --build-arg "PHP_SECURITY_COMMIT=$PHP_SECURITY_COMMIT" \
            --build-arg "PATCH_SHA256=$PATCH_SHA256" \
            --tag drupal-php-backport:test \
            . 2>&1 | tee .artifacts/docker-build.log
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          failure=$(grep -Ei 'error:|failed|not found|undefined reference|killed|no such file|exit code' .artifacts/docker-build.log | tail -n 20 | tr '\n' ' ')
          echo "::error title=Docker build failed::$failure"
          exit 1
      - name: Test runtime and image parity
        id: runtime
        continue-on-error: true
        env:
          FIXED_IMAGE: drupal-php-backport:test
          ARTIFACT_DIR: .artifacts
        run: |
          set -o pipefail
          sh scripts/test-image.sh 2>&1 | tee .artifacts/runtime-test.log
      - name: Report runtime test failure
        if: steps.runtime.outcome == 'failure'
        run: |
          failure=$(tail -n 80 .artifacts/runtime-test.log | tr '\n' ' ')
          echo "::error title=Runtime or image parity test failed::$failure"
          exit 1
      - name: Export image metadata
        run: |
          docker image inspect drupal-php-backport:test > .artifacts/fixed-image-inspect.json
          docker run --rm --entrypoint php drupal-php-backport:test -i > .artifacts/fixed-php-info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: .artifacts/
          include-hidden-files: true
